<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monowing Monitor — Data Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f0f4f8;--surface:#fff;--surface2:#f8fafc;--border:#dde3ea;--accent:#2563eb;--accent2:#06b6d4;--text:#1e293b;--dim:#64748b;--muted:#94a3b8;--danger:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:8px;flex-wrap:wrap;}
.hbrand{display:flex;align-items:center;gap:10px;}
.hicon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.hlabel{font-size:9px;color:var(--accent);letter-spacing:3px;font-family:monospace;}
.htitle{font-size:15px;font-weight:700;}
.hdate{font-size:10px;color:var(--dim);font-family:monospace;}
.hactions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;font-family:monospace;font-size:11px;padding:6px 12px;border-radius:6px;cursor:pointer;border:1px solid;transition:all .2s;white-space:nowrap;background:none;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:#1d4ed8;}
.btn-outline{background:rgba(37,99,235,.08);color:var(--accent);border-color:rgba(37,99,235,.3);}
.btn-outline:hover{background:rgba(37,99,235,.18);}
.btn-danger{background:rgba(239,68,68,.08);color:var(--danger);border-color:rgba(239,68,68,.3);}
.btn-danger:hover{background:rgba(239,68,68,.18);}

/* LAYOUT */
.layout{display:flex;flex:1;height:calc(100vh - 57px);overflow:hidden;}

/* SIDEBAR */
aside{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.slabel{font-size:9px;letter-spacing:3px;color:var(--muted);padding:12px 14px 6px;font-family:monospace;}
#eq-list{flex:1;overflow-y:auto;}
.eq-item{padding:9px 12px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;}
.eq-item:hover{background:var(--surface2);}
.eq-item.active{background:var(--surface2);border-left-color:var(--accent);}
.eq-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.eq-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.eq-name{font-size:11px;font-weight:600;color:#5a7a94;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.eq-item.active .eq-name{color:#1e293b;}
.eq-date{font-size:9px;color:var(--muted);font-family:monospace;padding-left:15px;margin-top:2px;}
.eq-tags{display:flex;flex-wrap:wrap;gap:3px;padding-left:15px;margin-top:3px;}
.eq-tag{font-size:9px;font-family:monospace;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.15);color:#3b5268;padding:1px 5px;border-radius:3px;}
.eq-item.active .eq-tag{color:var(--accent);border-color:rgba(37,99,235,.3);}
.eq-del{opacity:0;font-size:12px;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:3px;color:var(--danger);}
.eq-item:hover .eq-del{opacity:1;}
.upload-area{position:relative;margin:8px;border:2px dashed var(--border);border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;color:var(--muted);font-size:11px;transition:all .2s;font-family:monospace;display:block;}
.upload-area:hover{border-color:var(--accent);color:var(--accent);background:rgba(37,99,235,.04);}

/* MAIN */
main{flex:1;overflow-y:auto;min-width:0;}

/* EMPTY STATE - centered properly */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:calc(100vh - 100px);
  text-align:center;padding:40px;
}
.empty-icon{font-size:64px;margin-bottom:20px;}
.empty-title{font-size:18px;font-weight:700;color:#1e293b;margin-bottom:8px;}
.empty-sub{font-size:12px;color:var(--muted);font-family:monospace;margin-bottom:28px;line-height:1.6;}
.upload-btn-wrap{position:relative;display:inline-block;}
.upload-btn-wrap input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:10;}

/* CHARTS AREA */
.charts-area{padding:14px 18px;}
.device-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;}
.dlabel{font-size:9px;color:var(--muted);letter-spacing:2px;font-family:monospace;margin-bottom:2px;}
.dvalue{font-size:13px;font-weight:600;color:#1e293b;font-family:monospace;}
.date-input{font-size:12px;font-family:monospace;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:#fff;color:#1e293b;cursor:pointer;}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.sec-title{font-size:14px;font-weight:700;color:#1e293b;}
.sec-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* CHART CARD */
.chart-card{display:flex;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:4px;overflow:hidden;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.chart-left{flex-shrink:0;width:150px;padding:10px 12px;border-right:1px solid var(--border);background:#f1f5f9;display:flex;flex-direction:column;justify-content:space-between;}
.chart-title-row{display:flex;align-items:center;gap:6px;}
.chart-stripe{width:3px;height:16px;border-radius:2px;flex-shrink:0;}
.chart-name{font-size:11px;font-weight:700;font-family:monospace;color:#1e293b;}
.chart-unit{font-size:10px;color:var(--dim);font-family:monospace;padding-left:9px;margin-top:1px;}
.chart-stats{display:flex;flex-direction:column;gap:3px;padding-left:9px;}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:4px;}
.stat-val{font-size:11px;font-weight:700;font-family:monospace;}
.stat-lbl{font-size:9px;color:var(--muted);letter-spacing:1px;}
.chart-btns{display:flex;gap:4px;padding-left:9px;margin-top:6px;}
.cbtn{font-size:10px;padding:3px 7px;border-radius:4px;cursor:pointer;border:1px solid;font-family:monospace;transition:all .15s;}
.cbtn-dl{background:rgba(37,99,235,.08);color:var(--accent);border-color:rgba(37,99,235,.25);}
.cbtn-dl:hover{background:rgba(37,99,235,.18);}
.cbtn-rm{background:rgba(239,68,68,.08);color:var(--danger);border-color:rgba(239,68,68,.25);}
.cbtn-rm:hover{background:rgba(239,68,68,.18);}

/* Chart right: scroll area */
.chart-right-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.chart-scroll{overflow-x:auto;overflow-y:hidden;padding:6px 8px 2px;}
.chart-scroll::-webkit-scrollbar{height:4px;}
.chart-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
.chart-wrap{position:relative;height:100px;}

/* Hours label below each chart - separate from scroll */
.hours-label{text-align:center;font-size:10px;color:var(--muted);font-family:monospace;letter-spacing:2px;padding:3px 0 6px;background:#fff;flex-shrink:0;}

/* DOWNLOAD MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.15);max-height:80vh;overflow-y:auto;}
.modal h3{font-size:15px;font-weight:700;margin-bottom:14px;color:#1e293b;}
.dl-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.dl-item:last-of-type{border-bottom:none;}
.dl-item input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}
.dl-item label{flex:1;font-size:12px;font-family:monospace;cursor:pointer;color:#1e293b;}
.dl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.eq-group-title{padding:8px 0 2px;font-size:11px;font-weight:700;color:#1e293b;font-family:monospace;border-top:1px solid #e2e8f0;margin-top:6px;}
.eq-group-title:first-child{border-top:none;margin-top:0;}

/* FOOTER */
footer{background:var(--surface);border-top:1px solid var(--border);padding:6px 20px;font-size:10px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
.credit{font-size:12px;font-weight:700;background:linear-gradient(135deg,#1d4ed8,#0891b2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;border:1px solid rgba(37,99,235,.25);padding:2px 10px;border-radius:6px;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<header>
  <div class="hbrand">
    <div class="hicon">📡</div>
    <div>
      <div class="hlabel">◆ MONOWING MONITOR</div>
      <div class="htitle">Data Dashboard</div>
    </div>
  </div>
  <div class="hactions">
    <div class="hdate" id="hdate"></div>
    <button class="btn btn-danger" onclick="clearAll()">🗑 Clear All</button>
    <button class="btn btn-outline" onclick="showDlModal()">⬇ Download</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="slabel">EQUIPMENT LIST</div>
    <div id="eq-list"></div>
    <div class="upload-area" style="position:relative;">
      <div style="font-size:18px;margin-bottom:3px;">＋</div>
      <div>Click / Drop CSV</div>
      <div style="font-size:9px;margin-top:2px;">MwData CSV format</div>
      <input type="file" id="file-input" accept=".csv" multiple
        style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:10;">
    </div>
  </aside>

  <main id="main">
    <!-- EMPTY STATE -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📡</div>
      <div class="empty-title">Monowing Monitor</div>
      <div class="empty-sub">
        Upload MwData CSV files to visualize<br>sensor data from your equipment
      </div>
      <div class="upload-btn-wrap">
        <button class="btn btn-primary" style="font-size:14px;padding:14px 32px;border-radius:10px;pointer-events:none;box-shadow:0 4px 12px rgba(37,99,235,.3);">
          📂 Upload CSV File
        </button>
        <input type="file" accept=".csv" multiple onchange="handleFiles(this.files)">
      </div>
    </div>

    <!-- CHARTS AREA -->
    <div class="charts-area" id="charts-area" style="display:none">
      <div class="device-card" id="device-info"></div>
      <div class="sec-header">
        <div class="sec-title" id="eq-title"></div>
        <div class="sec-actions">
          <div style="position:relative;display:inline-block;">
            <button class="btn btn-outline">＋ Add CSV</button>
            <input type="file" accept=".csv" multiple
              style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:10;"
              onchange="handleFiles(this.files)">
          </div>
          <button class="btn btn-danger" onclick="clearCurrent()">🗑 Clear</button>
        </div>
      </div>
      <div id="charts-container"></div>
    </div>
  </main>
</div>

<footer>
  <span id="foot-count">0 equipment registered</span>
  <span class="credit">✦ Putra Siagian</span>
</footer>

<!-- DOWNLOAD MODAL -->
<div class="modal-overlay" id="dl-modal" style="display:none" onclick="if(event.target===this)closeDlModal()">
  <div class="modal">
    <h3>⬇ Select Charts to Download</h3>
    <div id="dl-checklist"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="toggleAllDl()" id="dl-toggle">Deselect All</button>
      <button class="btn btn-primary" onclick="execDownload()">Download</button>
      <button class="btn btn-danger" onclick="closeDlModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────
const COLORS = ['#1d4ed8','#c2410c','#15803d','#b91c1c','#7e22ce','#0e7490'];
const METRICS = [
  { prefix:'ActuatorPos', label:'ActuatorPos', unit:'mm',  unitFull:'Position (mm)'  , color:COLORS[0] },
  { prefix:'BoomAngle',   label:'BoomAngle',   unit:'Deg', unitFull:'Angle (°)'       , color:COLORS[1] },
  { prefix:'AccPress',    label:'AccPress',     unit:'Bar', unitFull:'Pressure (Bar)'  , color:COLORS[2] },
  { prefix:'Battery',     label:'Battery',      unit:'V',   unitFull:'Voltage (V)'     , color:COLORS[3] },
  { prefix:'InputV',      label:'InputV',       unit:'V',   unitFull:'Voltage (V)'     , color:COLORS[4] },
];
const MAX_PTS = 1000;

// ── STATE ─────────────────────────────────────────────────
let equipments = [], selIdx = -1, chartInsts = [], syncLock = false;

// ── UTILS ─────────────────────────────────────────────────
function sample(data, max) {
  if (data.length <= max) return data;
  const step = data.length / max, out = [];
  for (let i = 0; i < max; i++) out.push(data[Math.round(i * step)]);
  return out;
}

function parseCSV(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const info = {}; let hdr = -1;
  for (let i = 0; i < lines.length; i++) {
    if (/^Time\s*,/i.test(lines[i])) { hdr = i; break; }
    const m = lines[i].match(/^([A-Za-z][A-Za-z0-9 \/]+?)\s{2,}(.+)$/);
    if (m) info[m[1].trim()] = m[2].trim();
  }
  if (hdr === -1) return { info, data: [] };
  const headers = lines[hdr].split(',').map(h => h.trim()).filter(Boolean);
  const data = [];
  for (let i = hdr + 1; i < lines.length; i++) {
    if (!lines[i]) continue;
    const vals = lines[i].split(',').map(v => v.trim());
    const row = {};
    headers.forEach((h, j) => { const n = parseFloat(vals[j]); row[h] = isNaN(n) ? vals[j] || '' : n; });
    if (Object.keys(row).some(k => k.trim().toLowerCase() === 'time')) data.push(row);
  }
  return { info, data };
}

function getName(info, file) {
  const n = info['Monowing no'], p = info['Monowing position'];
  return n ? `Monowing ${n}${p ? ' — ' + p : ''}` : file.replace(/\.csv$/i,'').replace(/[_-]/g,' ');
}

function findKey(row, prefix) { return Object.keys(row).find(k => k.startsWith(prefix)); }
function today() { return new Date().toISOString().slice(0,10); }

// Extract HH:MM from timestamp string
function toHM(s) {
  const str = String(s||'');
  const tp = str.includes(' ') ? str.split(' ')[1] : str;
  return tp ? tp.slice(0,5) : '';
}

// Build display labels: ~10 evenly spaced HH:MM labels
function buildLabels(rawLabels) {
  const step = Math.max(1, Math.floor(rawLabels.length / 10));
  return rawLabels.map((l, i) => (i % step === 0 || i === rawLabels.length - 1) ? toHM(l) : '');
}

// ── SIDEBAR ───────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('eq-list');
  list.innerHTML = '';
  equipments.forEach((eq, i) => {
    const el = document.createElement('div');
    el.className = 'eq-item' + (i === selIdx ? ' active' : '');
    const tags = eq.info['Monowing no'] ? [`<span class="eq-tag">MW #${eq.info['Monowing no']}</span>`] : [];
    el.innerHTML = `
      <div class="eq-top">
        <div class="eq-dot" style="background:${COLORS[i%COLORS.length]}"></div>
        <div class="eq-name">${eq.name}</div>
        <button class="eq-del" onclick="delEq(event,${i})">✕</button>
      </div>
      ${eq.userDate ? `<div class="eq-date">📅 ${eq.userDate}</div>` : ''}
      <div class="eq-tags">${tags.join('')}</div>`;
    el.addEventListener('click', () => selectEq(i));
    list.appendChild(el);
  });
  document.getElementById('foot-count').textContent = `${equipments.length} equipment registered`;
}

function selectEq(i) { selIdx = i; renderSidebar(); renderCharts(); }
function delEq(e, i) {
  e.stopPropagation();
  equipments.splice(i, 1);
  if (selIdx >= equipments.length) selIdx = equipments.length - 1;
  renderSidebar(); renderCharts();
}
function clearAll() {
  if (!equipments.length) return;
  if (!confirm('Clear all equipment?')) return;
  chartInsts.forEach(c => c.chart.destroy());
  chartInsts = []; equipments = []; selIdx = -1;
  renderSidebar(); renderCharts();
}
function clearCurrent() {
  if (selIdx < 0) return;
  if (!confirm(`Clear "${equipments[selIdx].name}"?`)) return;
  delEq({ stopPropagation:()=>{} }, selIdx);
}

// ── RENDER CHARTS ─────────────────────────────────────────
function renderCharts() {
  chartInsts.forEach(c => c.chart.destroy()); chartInsts = [];
  const empty = document.getElementById('empty-state');
  const area  = document.getElementById('charts-area');
  const cont  = document.getElementById('charts-container');
  if (selIdx < 0 || !equipments[selIdx]) {
    empty.style.display = 'flex'; area.style.display = 'none'; return;
  }
  empty.style.display = 'none'; area.style.display = 'block';

  const eq = equipments[selIdx];
  document.getElementById('eq-title').textContent = eq.name;

  // Device info
  const di = document.getElementById('device-info');
  di.innerHTML = `
    ${eq.info['Monowing no'] ? `<div><div class="dlabel">MONOWING NO</div><div class="dvalue">${eq.info['Monowing no']}</div></div>` : ''}
    <div><div class="dlabel">DATA TOTAL</div><div class="dvalue">${eq.data.length.toLocaleString()} pts</div></div>
    <div><div class="dlabel">SAMPLE RATE</div><div class="dvalue">1 per ${eq.data.length > MAX_PTS ? Math.round(eq.data.length/MAX_PTS) : 1} pts</div></div>
    <div>
      <div class="dlabel">📅 DATA DATE</div>
      <input type="date" class="date-input" value="${eq.userDate||today()}"
        onchange="setDate(${selIdx},this.value)">
    </div>`;

  const sampled = sample(eq.data, MAX_PTS);
  const timeKey = Object.keys(sampled[0]||{}).find(k=>k.trim().toLowerCase()==='time')||'Time';
  const rawLabels = sampled.map(d => (d[timeKey]||'').toString().trim());
  const displayLabels = buildLabels(rawLabels);
  const firstRow = sampled[0] || {};

  const mainEl = document.getElementById('main');
  const chartW = Math.round((mainEl.clientWidth - 40) * 3);

  cont.innerHTML = '';

  METRICS.forEach((metric, mi) => {
    const dk = findKey(firstRow, metric.prefix);
    if (!dk) return;
    const vals = sampled.map(d => typeof d[dk]==='number' ? d[dk] : null);
    const nums = vals.filter(v => v!==null);
    if (!nums.length) return;

    const minV = Math.min(...nums), maxV = Math.max(...nums), lastV = nums[nums.length-1];
    const pad  = (maxV-minV)*0.12||0.05;
    const color = metric.color;

    // Card
    const card = document.createElement('div');
    card.className = 'chart-card'; card.id = `card-${mi}`;
    card.innerHTML = `
      <div class="chart-left">
        <div>
          <div class="chart-title-row">
            <div class="chart-stripe" style="background:${color}"></div>
            <div class="chart-name">${metric.label}</div>
          </div>
          <div class="chart-unit">${metric.unitFull}</div>
        </div>
        <div class="chart-stats">
          <div class="stat"><span class="stat-lbl">LAST</span><span class="stat-val" style="color:${color}">${lastV.toFixed(2)}</span></div>
          <div class="stat"><span class="stat-lbl">MIN</span><span class="stat-val">${minV.toFixed(2)}</span></div>
          <div class="stat"><span class="stat-lbl">MAX</span><span class="stat-val">${maxV.toFixed(2)}</span></div>
        </div>
        <div class="chart-btns">
          <button class="cbtn cbtn-dl" onclick="dlSingle(${mi})">⬇</button>
          <button class="cbtn cbtn-rm" onclick="rmChart(${mi})">✕</button>
        </div>
      </div>
      <div class="chart-right-col">
        <div class="chart-scroll" id="cs-${mi}">
          <div class="chart-wrap" style="width:${chartW}px">
            <canvas id="chart-${mi}"></canvas>
          </div>
        </div>
        <div class="hours-label">— hours —</div>
      </div>`;
    cont.appendChild(card);

    // Sync scroll
    setTimeout(() => {
      const el = document.getElementById(`cs-${mi}`);
      if (el) el.addEventListener('scroll', () => {
        if (syncLock) return; syncLock = true;
        document.querySelectorAll('.chart-scroll').forEach(e => { if(e!==el) e.scrollLeft=el.scrollLeft; });
        syncLock = false;
      });
    }, 0);

    const ctx = document.getElementById(`chart-${mi}`).getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      plugins: [{ id:'wb', beforeDraw:(c)=>{ c.ctx.save(); c.ctx.fillStyle='#fff'; c.ctx.fillRect(0,0,c.width,c.height); c.ctx.restore(); } }],
      data: {
        labels: displayLabels,
        datasets: [{ data:vals, rawLabels, borderColor:color, borderWidth:2, pointRadius:0, pointHoverRadius:4, tension:0.3, fill:false }]
      },
      options: {
        responsive:true, maintainAspectRatio:false, animation:{duration:300},
        plugins: {
          legend:{display:false},
          tooltip:{
            backgroundColor:'#fff', borderColor:color, borderWidth:1,
            titleColor:'#64748b', bodyColor:'#1e293b',
            callbacks:{
              title:(items) => rawLabels[items[0].dataIndex]||'',
              label:(item) => ` ${metric.label}: ${item.raw??'N/A'} ${metric.unit}`
            }
          }
        },
        scales: {
          x:{
            grid:{color:'#e2e8f0'}, border:{display:false},
            ticks:{ color:'#64748b', font:{size:10}, maxRotation:0, maxTicksLimit:12,
              callback:(val,i) => displayLabels[i]||''
            }
          },
          y:{
            min:minV-pad, max:maxV+pad,
            grid:{color:'#e2e8f0'}, border:{display:false},
            title:{ display:true, text:metric.unitFull, color:'#64748b', font:{size:10} },
            ticks:{ color:'#64748b', font:{size:10}, maxTicksLimit:4 }
          }
        }
      }
    });
    chartInsts.push({ chart, metric, mi, vals, minV, maxV, rawLabels, displayLabels });
  });

  setTimeout(() => { document.querySelectorAll('.chart-scroll').forEach(e => e.scrollLeft=e.scrollWidth); }, 500);
}

function setDate(idx, val) { if(equipments[idx]){ equipments[idx].userDate=val; renderSidebar(); renderCharts(); } }
function rmChart(mi) {
  const ci = chartInsts.find(c=>c.mi===mi); if(ci) ci.chart.destroy();
  chartInsts = chartInsts.filter(c=>c.mi!==mi);
  const card = document.getElementById(`card-${mi}`); if(card) card.remove();
}

// ── FILE HANDLING ─────────────────────────────────────────
async function handleFiles(files) {
  for (const f of files) {
    if (!f.name.toLowerCase().endsWith('.csv')) continue;
    try {
      const eq = await readCSV(f); equipments.push(eq); selIdx = equipments.length-1;
    } catch { alert('Failed: '+f.name); }
  }
  renderSidebar(); renderCharts();
}
document.getElementById('file-input').addEventListener('change', async e => { await handleFiles(e.target.files); e.target.value=''; });

// Drag drop on sidebar
const dz = document.getElementById('file-input').parentElement;
document.querySelector('aside').addEventListener('dragover', e=>{ e.preventDefault(); });
document.querySelector('aside').addEventListener('drop', async e=>{ e.preventDefault(); await handleFiles(e.dataTransfer.files); });

function readCSV(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      try {
        const { info, data } = parseCSV(e.target.result);
        res({ id:Date.now()+Math.random(), name:getName(info,file.name), info, data, fileName:file.name, userDate:today() });
      } catch(err) { rej(err); }
    };
    r.onerror = rej; r.readAsText(file);
  });
}

// ── DOWNLOAD MODAL ────────────────────────────────────────
let dlAll = true;
function showDlModal() {
  if (!equipments.length) { alert('No data.'); return; }
  const cl = document.getElementById('dl-checklist');
  cl.innerHTML = equipments.map((eq,ei) => `
    <div class="eq-group-title">
      <input type="checkbox" id="deq-${ei}" onchange="toggleEqGroup(${ei})" checked style="margin-right:6px;accent-color:#2563eb;">
      <span style="color:${COLORS[ei%COLORS.length]}">●</span> ${eq.name}
      ${eq.userDate?`<span style="color:#94a3b8;font-weight:400"> · ${eq.userDate}</span>`:''}
    </div>
    ${METRICS.map((m,mi)=>`
      <div class="dl-item" style="padding-left:20px;">
        <input type="checkbox" id="dc-${ei}-${mi}" data-ei="${ei}" checked>
        <div class="dl-dot" style="background:${m.color}"></div>
        <label for="dc-${ei}-${mi}">${m.label} [${m.unit}]</label>
      </div>`).join('')}
  `).join('');
  document.getElementById('dl-modal').style.display='flex';
}
function closeDlModal() { document.getElementById('dl-modal').style.display='none'; }
function toggleEqGroup(ei) {
  const master = document.getElementById(`deq-${ei}`);
  METRICS.forEach((_,mi)=>{ const cb=document.getElementById(`dc-${ei}-${mi}`); if(cb) cb.checked=master.checked; });
}
function toggleAllDl() {
  dlAll=!dlAll;
  document.querySelectorAll('[id^=dc-],[id^=deq-]').forEach(cb=>cb.checked=dlAll);
  document.getElementById('dl-toggle').textContent=dlAll?'Deselect All':'Select All';
}
async function execDownload() {
  const tasks={};
  equipments.forEach((eq,ei)=>{
    METRICS.forEach((m,mi)=>{
      const cb=document.getElementById(`dc-${ei}-${mi}`);
      if(cb&&cb.checked){
        if(!tasks[ei]) tasks[ei]=[];
        const s=sample(eq.data,MAX_PTS);
        const tk=Object.keys(s[0]||{}).find(k=>k.trim().toLowerCase()==='time')||'Time';
        const raw=s.map(d=>(d[tk]||'').toString().trim());
        const dk=findKey(s[0]||{},m.prefix);
        const vals=dk?s.map(d=>typeof d[dk]==='number'?d[dk]:null):[];
        const nums=vals.filter(v=>v!==null);
        tasks[ei].push({eq,m,vals,minV:nums.length?Math.min(...nums):0,maxV:nums.length?Math.max(...nums):1,raw});
      }
    });
  });
  if(!Object.keys(tasks).length){alert('Select at least one.');return;}
  closeDlModal();
  for(const ei of Object.keys(tasks)) await doDownload(equipments[ei], tasks[ei]);
}
async function dlSingle(mi) {
  const ci=chartInsts.find(c=>c.mi===mi); if(!ci) return;
  const eq=equipments[selIdx];
  await doDownload(eq,[{eq,m:ci.metric,vals:ci.vals,minV:ci.minV,maxV:ci.maxV,raw:ci.rawLabels}]);
}

// ── DOWNLOAD ENGINE ───────────────────────────────────────
async function doDownload(eq, tasks) {
  try {
    const SC=2,PAD=32,LW=210,CH=160,HOURS_H=24,ROW_H=CH+HOURS_H+40,GAP=12,TH=60,IH=74,FW=1400;
    const totalH=(TH+IH+PAD+tasks.length*(ROW_H+GAP)+PAD)*SC;
    const totalW=(LW+FW+PAD*2)*SC;
    const out=document.createElement('canvas'); out.width=totalW; out.height=totalH;
    const ctx=out.getContext('2d'); ctx.scale(SC,SC);
    const W=totalW/SC;

    // Background
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,totalH/SC);

    // Title
    ctx.fillStyle='#1e293b'; ctx.font='bold 18px sans-serif'; ctx.fillText(eq.name||'',PAD,PAD+22);
    ctx.fillStyle='#64748b'; ctx.font='12px monospace';
    const ds=eq.userDate?new Date(eq.userDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'long',day:'numeric'}):new Date().toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'long',day:'numeric'});
    ctx.fillText(ds,PAD,PAD+42);

    // Info bar
    const iy=TH+4;
    ctx.fillStyle='#f1f5f9'; ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1;
    rr(ctx,PAD,iy,W-PAD*2,IH-8,6); ctx.fill(); ctx.stroke();
    [['MONOWING NO',eq.info['Monowing no']||'-'],['DATA TOTAL',eq.data.length.toLocaleString()+' pts'],
     ['SAMPLE RATE','1 per '+(eq.data.length>MAX_PTS?Math.round(eq.data.length/MAX_PTS):1)+' pts'],['DATA DATE',eq.userDate||'—']
    ].forEach(([l,v],i)=>{
      const fx=PAD+16+i*200;
      ctx.fillStyle='#94a3b8'; ctx.font='10px monospace'; ctx.fillText(l,fx,iy+18);
      ctx.fillStyle='#0f172a'; ctx.font='bold 13px monospace'; ctx.fillText(v,fx,iy+38);
    });

    // Build & render all tmpCharts first
    const tcs=[],tCharts=[];
    for(const {eq:_,m,vals,minV,maxV,raw} of tasks){
      const pad2=(maxV-minV)*0.12||0.05;
      const dlLbls=buildLabels(raw);
      const tc=document.createElement('canvas');
      tc.width=FW-16; tc.height=CH;
      tc.style.cssText='position:fixed;left:-9999px;top:0;visibility:hidden;';
      document.body.appendChild(tc);
      const tChart=new Chart(tc,{
        type:'line',
        plugins:[{id:'wb',beforeDraw:(c)=>{c.ctx.save();c.ctx.fillStyle='#fff';c.ctx.fillRect(0,0,c.width,c.height);c.ctx.restore();}}],
        data:{labels:dlLbls,datasets:[{data:vals,borderColor:m.color,borderWidth:2.5,pointRadius:0,tension:0.3,fill:false}]},
        options:{
          responsive:false,maintainAspectRatio:false,animation:false,
          plugins:{legend:{display:false},tooltip:{enabled:false}},
          scales:{
            x:{grid:{color:'#e2e8f0'},border:{display:false},
              ticks:{color:'#334155',font:{size:11},maxRotation:0,maxTicksLimit:12,
                callback:(val,i)=>dlLbls[i]||''}},
            y:{min:minV-pad2,max:maxV+pad2,grid:{color:'#e2e8f0'},border:{display:false},
              title:{display:true,text:m.unitFull,color:'#334155',font:{size:10}},
              ticks:{color:'#334155',font:{size:11},maxTicksLimit:4}}
          }
        }
      });
      tcs.push(tc); tCharts.push(tChart);
    }

    // Wait for render
    await new Promise(r=>setTimeout(r,800));
    await new Promise(r=>requestAnimationFrame(r));
    await new Promise(r=>requestAnimationFrame(r));

    // Draw each row
    let y=TH+IH+PAD;
    for(let i=0;i<tasks.length;i++){
      const {m,vals,minV,maxV}=tasks[i];
      const lastV=vals.filter(v=>v!==null).slice(-1)[0];
      const cW=W-PAD*2;

      ctx.fillStyle='#fff'; ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
      rr(ctx,PAD,y,cW,ROW_H,8); ctx.fill(); ctx.stroke();
      rrl(ctx,PAD,y,LW,ROW_H,8); ctx.fillStyle='#f8fafc'; ctx.fill(); ctx.stroke();

      ctx.fillStyle=m.color; ctx.fillRect(PAD+12,y+14,4,22);
      ctx.fillStyle='#0f172a'; ctx.font='bold 13px monospace'; ctx.fillText(m.label,PAD+22,y+30);
      ctx.fillStyle='#64748b'; ctx.font='11px monospace'; ctx.fillText(m.unitFull,PAD+22,y+46);

      [['LAST',lastV,m.color],['MIN',minV,'#334155'],['MAX',maxV,'#334155']].forEach(([l,v,c],si)=>{
        const sy=y+66+si*30;
        ctx.fillStyle='#94a3b8'; ctx.font='10px monospace'; ctx.fillText(l,PAD+14,sy);
        ctx.fillStyle=c; ctx.font='bold 14px monospace'; ctx.fillText(v?.toFixed(2)??'-',PAD+LW-80,sy);
      });

      ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD+LW,y); ctx.lineTo(PAD+LW,y+ROW_H); ctx.stroke();

      // Draw chart (CH height, leaving HOURS_H space below)
      ctx.drawImage(tcs[i],PAD+LW+8,y+8,FW-16,CH);

      // Draw "— hours —" below chart, in the HOURS_H space
      ctx.fillStyle='#94a3b8'; ctx.font='11px monospace'; ctx.textAlign='center';
      ctx.fillText('— hours —', PAD+LW+(FW/2), y+8+CH+16);
      ctx.textAlign='left';

      tCharts[i].destroy(); document.body.removeChild(tcs[i]);
      y+=ROW_H+GAP;
    }

    function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
    function rrl(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

    const dataUrl=out.toDataURL('image/png');
    const tag=(eq.userDate||today()).replace(/-/g,'');
    const nm=(eq.name||'monowing').replace(/[^a-z0-9]/gi,'_').toLowerCase();
    const mtag=tasks.length===1?`_${tasks[0].m.label}`:'';
    const fn=`${nm}${mtag}_${tag}.png`;

    const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
    const isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    if(isIOS||isSafari){
      const t=window.open();
      if(t){t.document.write(`<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>${fn}</title><style>body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;padding:12px}p{color:#fff;font-family:sans-serif;font-size:13px;text-align:center;background:rgba(255,255,255,.1);border-radius:8px;padding:10px 16px;margin-bottom:10px}img{max-width:100%}</style></head><body><p>📥 Press &amp; hold → <b>Save to Photos</b></p><img src="${dataUrl}"></body></html>`);t.document.close();}
      else imgModal(dataUrl,fn);
    } else {
      const a=document.createElement('a'); a.download=fn; a.href=dataUrl;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
  } catch(err){ alert('Download failed: '+err.message); }
}

function imgModal(url,fn){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:16px;';
  o.innerHTML=`<div style="color:#fff;font-family:sans-serif;font-size:13px;text-align:center;background:rgba(59,130,246,.2);border:1px solid #3b82f6;border-radius:8px;padding:10px 16px;margin-bottom:12px;">📥 Press &amp; hold → <b>Save to Photos</b><br><br><button onclick="this.closest('div').parentElement.remove()" style="background:#3b82f6;color:#fff;border:none;padding:6px 18px;border-radius:6px;font-size:12px;cursor:pointer;">✕ Close</button></div><img src="${url}" style="max-width:100%;border-radius:8px;">`;
  document.body.appendChild(o);
}

renderSidebar(); renderCharts();
</script>
